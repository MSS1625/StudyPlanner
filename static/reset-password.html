<!--
    static/reset-password.html
    صفحه‌یِ «تعیینِ رمزِ جدید» با لینکِ بازیابی (از 2026-09-12). کاربر از
    ایمیلِ بازیابی به این صفحه می‌آید: uid و token در query string است
    (?uid=...&token=...) و همین صفحه آن‌ها را به
    POST /api/auth/password/reset/confirm/ می‌فرستد. data-page="reset-password"
    روی <body> باعث می‌شود در انتهای app.js تابعِ handlePasswordReset() صدا
    زده شود. بدونِ uid/token (مثلاً بازکردنِ مستقیمِ آدرس) صفحه پیامِ خطای
    صریح می‌دهد و فرم غیرفعال می‌ماند.
-->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // چندزبانی (از 2026-09-09): اگر زبانِ ذخیره‌شده «en» باشد، جهتِ صفحه را
        // پیش از اولین رندر به LTR می‌گذاریم تا چیدمانِ فارسی یک لحظه «فلش» نزند.
        try {
            if (localStorage.getItem('ssp_lang') === 'en') {
                document.documentElement.lang = 'en';
                document.documentElement.dir = 'ltr';
            }
        } catch (e) { /* localStorage در دسترس نیست → همان پیش‌فرضِ فارسی */ }
    </script>
    <title>بازیابی رمز عبور | برنامه‌ریز هوشمند مطالعه</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page" data-page="reset-password">
    <div class="auth-card">
        <div class="auth-header">
            <button type="button" class="ghost-button lang-toggle" id="langToggle">English</button>
            <h1>تعیین رمز جدید</h1>
            <p>رمز عبور جدید حساب خود را وارد کنید.</p>
        </div>
        <!-- جای نمایشِ پیام‌های موفقیت/خطا (توسط showToast در app.js پر می‌شود) -->
        <div id="toast" class="toast" role="alert"></div>
        <!-- خطای «لینک نامعتبر» (بدونِ uid/token): قبل از فرم؛ فرم را app.js
             غیرفعال می‌کند تا درخواستِ بی‌معنا اصلاً ارسال نشود. -->
        <p id="resetLinkError" class="field-hint" hidden role="alert"></p>
        <form id="resetPasswordForm" class="auth-form">
            <div class="form-field">
                <label for="resetNewPassword">رمز عبور جدید</label>
                <input
                    type="password"
                    id="resetNewPassword"
                    name="new_password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                />
                <!-- قواعدِ رمز (از 2026-09-10): همان چیزی که سرور با
                     AUTH_PASSWORD_VALIDATORS اجباری می‌کند — این متن فقط
                     انتظار را قبل از ارسالِ فرم شفاف می‌کند. -->
                <p class="field-hint">
                    رمز عبور باید حداقل ۸ نویسه باشد، با نام کاربری شما شبیه نباشد و از رمزهای رایج نباشد.
                </p>
            </div>
            <div class="form-field">
                <label for="resetConfirmPassword">تکرار رمز عبور جدید</label>
                <input
                    type="password"
                    id="resetConfirmPassword"
                    name="confirm_password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                />
            </div>
            <button
                id="resetActionBtn"
                class="primary-button auth-button"
                type="submit"
            >
                بازنشانی رمز عبور
            </button>
            <p class="auth-switch">
                <a href="login.html">بازگشت به صفحه ورود</a>
            </p>
        </form>
    </div>
    <script src="i18n.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
