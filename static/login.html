<!--
    static/login.html
    صفحه‌ی ورود. data-page="login" روی <body> باعث می‌شود در انتهای app.js
    تابعِ handleLogin() صدا زده شود (نگاه کنید به روترِ سبکِ انتهای app.js).
-->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | برنامه‌ریز هوشمند مطالعه</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page" data-page="login">
    <div class="auth-card">
        <div class="auth-header">
            <h1>ورود به حساب</h1>
            <p>برای ادامه، نام کاربری و رمز عبور را وارد کنید.</p>
        </div>
        <!-- جای نمایشِ پیام‌های موفقیت/خطا (توسط showToast در app.js پر می‌شود) -->
        <div id="toast" class="toast" role="alert"></div>
        <!-- فرمِ ورود: submit آن در handleLogin() گرفته و به POST /api/auth/login/ فرستاده می‌شود -->
        <form id="loginForm" class="auth-form">
            <div class="form-field">
                <label for="loginUsername">نام کاربری</label>
                <input type="text" id="loginUsername" name="username" autocomplete="username" required>
            </div>
            <div class="form-field">
                <label for="loginPassword">رمز عبور</label>
                <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
            </div>
            <button class="primary-button auth-button" type="submit">ورود</button>
            <p class="auth-switch">
                حساب ندارید؟
                <a href="register.html">ثبت‌نام کنید</a>
            </p>
        </form>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
