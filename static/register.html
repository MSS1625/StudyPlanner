<!--
    static/register.html
    صفحه‌ی ثبت‌نام. data-page="register" باعث می‌شود در روترِ انتهای app.js
    تابعِ handleRegister() صدا زده شود.
-->
<!doctype html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            // چندزبانی (از 2026-09-09): اگر زبانِ ذخیره‌شده «en» باشد، جهتِ صفحه را
            // پیش از اولین رندر به LTR می‌گذاریم تا چیدمانِ فارسی یک لحظه «فلش» نزند.
            try {
                if (localStorage.getItem('ssp_lang') === 'en') {
                    document.documentElement.lang = 'en';
                    document.documentElement.dir = 'ltr';
                }
            } catch (e) { /* localStorage در دسترس نیست → همان پیش‌فرضِ فارسی */ }
        </script>
        <title>ثبت‌نام | برنامه‌ریز هوشمند مطالعه</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="auth-page" data-page="register">
        <div class="auth-card">
            <div class="auth-header">
                <button type="button" class="ghost-button lang-toggle" id="langToggle">English</button>
                <h1>ایجاد حساب جدید</h1>
                <p>با ساخت حساب، برنامه‌ مطالعاتی خود را مدیریت کنید.</p>
            </div>
            <div id="toast" class="toast" role="alert"></div>
            <!-- اضافه شدن onsubmit به تگ فرم -->
            <!--
                فرمِ ثبت‌نام: submit آن در handleRegister() (در app.js) گرفته
                می‌شود و به POST /api/auth/register/ فرستاده می‌شود. بعد از
                موفقیت، دکمه‌ی زیر با جاوااسکریپت به یک لینکِ «ورود به حساب»
                تبدیل می‌شود (نگاه کنید به id="authActionBtn").
            -->
            <form id="registerForm" class="auth-form">
                <div class="form-field">
                    <label for="registerUsername">نام کاربری</label>
                    <input
                        type="text"
                        id="registerUsername"
                        name="username"
                        autocomplete="username"
                        required
                    />
                </div>
                <div class="form-field">
                    <label for="registerEmail">ایمیل (اختیاری)</label>
                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        autocomplete="email"
                    />
                </div>
                <div class="form-field">
                    <label for="registerPassword">رمز عبور</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        autocomplete="new-password"
                        required
                    />
                    <!-- قواعدِ رمز (از 2026-09-10): همان چیزی که سرور با
                         AUTH_PASSWORD_VALIDATORS اجباری می‌کند — این متن فقط
                         انتظار را قبل از ارسالِ فرم شفاف می‌کند. -->
                    <p class="field-hint">
                        رمز عبور باید حداقل ۸ نویسه باشد، با نام کاربری شما شبیه نباشد و از رمزهای رایج نباشد.
                    </p>
                </div>
                <button
                    id="authActionBtn"
                    class="primary-button auth-button"
                    type="submit"
                >
                    ثبت‌نام
                </button>
                <p id="loginPrompt" class="auth-switch">
                    حساب دارید؟
                    <a href="login.html">ورود</a>
                </p>
            </form>
        </div>
        <script src="i18n.js" defer></script>
        <script src="app.js" defer></script>
    </body>
</html>
